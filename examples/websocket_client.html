<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Agent System - Real-time Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .create-project {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
        }
        
        button {
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        .projects {
            display: grid;
            gap: 20px;
        }
        
        .project {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .project-id {
            font-family: monospace;
            color: #666;
            font-size: 14px;
        }
        
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-running {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-completed {
            background: #d4edda;
            color: #155724;
        }
        
        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }
        
        .stages {
            display: grid;
            gap: 10px;
        }
        
        .stage {
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #e0e0e0;
            transition: all 0.3s;
        }
        
        .stage-pending {
            background: #f8f9fa;
            border-left-color: #e0e0e0;
        }
        
        .stage-running {
            background: #fff3cd;
            border-left-color: #ffc107;
            animation: pulse 2s infinite;
        }
        
        .stage-completed {
            background: #d4edda;
            border-left-color: #28a745;
        }
        
        .stage-failed {
            background: #f8d7da;
            border-left-color: #dc3545;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .stage-name {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stage-details {
            font-size: 14px;
            color: #666;
        }
        
        .connection-status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .connected {
            background: #d4edda;
            color: #155724;
        }
        
        .disconnected {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Multi-Agent System Dashboard</h1>
            <p>Real-time monitoring of agent workflows</p>
            
            <div class="create-project">
                <input type="text" id="promptInput" placeholder="Enter your app idea (e.g., Build a blog platform)">
                <button onclick="createProject()">Create Project</button>
            </div>
        </div>
        
        <div id="connectionStatus" class="connection-status disconnected">
            ⚠️ API Server not connected - Start with: python api/api_server.py
        </div>
        
        <div id="projects" class="projects"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        const WS_URL = 'ws://localhost:8000';
        const projects = new Map();

        // Check if API server is running
        async function checkConnection() {
            try {
                const response = await fetch(`${API_URL}/health`);
                if (response.ok) {
                    document.getElementById('connectionStatus').className = 'connection-status connected';
                    document.getElementById('connectionStatus').textContent = '✅ Connected to API Server';
                    return true;
                }
            } catch (error) {
                document.getElementById('connectionStatus').className = 'connection-status disconnected';
                document.getElementById('connectionStatus').textContent = '⚠️ API Server not connected - Start with: python api/api_server.py';
                return false;
            }
        }

        // Create new project
        async function createProject() {
            const prompt = document.getElementById('promptInput').value.trim();
            if (!prompt) {
                alert('Please enter an app idea');
                return;
            }

            if (!await checkConnection()) {
                alert('API server is not running. Please start it with: python api/api_server.py');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/projects`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        prompt: prompt,
                        context: {}
                    })
                });

                const data = await response.json();
                document.getElementById('promptInput').value = '';
                
                // Add project to UI
                addProject(data.project_id, prompt);
                
                // Connect WebSocket
                connectWebSocket(data.project_id);
            } catch (error) {
                alert('Error creating project: ' + error.message);
            }
        }

        // Add project to UI
        function addProject(projectId, prompt) {
            const projectDiv = document.createElement('div');
            projectDiv.className = 'project';
            projectDiv.id = `project-${projectId}`;
            projectDiv.innerHTML = `
                <div class="project-header">
                    <div>
                        <h3>${prompt}</h3>
                        <div class="project-id">ID: ${projectId}</div>
                    </div>
                    <div class="status-badge status-running">Running</div>
                </div>
                <div class="stages" id="stages-${projectId}"></div>
            `;
            
            document.getElementById('projects').prepend(projectDiv);
            projects.set(projectId, {prompt, stages: new Map()});
        }

        // Connect WebSocket for project
        function connectWebSocket(projectId) {
            const ws = new WebSocket(`${WS_URL}/ws/projects/${projectId}`);
            
            ws.onopen = () => {
                console.log(`Connected to project ${projectId}`);
            };
            
            ws.onmessage = (event) => {
                const update = JSON.parse(event.data);
                handleUpdate(projectId, update);
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
            
            ws.onclose = () => {
                console.log(`Disconnected from project ${projectId}`);
            };
        }

        // Handle real-time updates
        function handleUpdate(projectId, update) {
            const project = projects.get(projectId);
            if (!project) return;

            switch(update.type) {
                case 'task_started':
                    addStage(projectId, update.data.stage_name, 'running');
                    break;
                
                case 'task_completed':
                    updateStage(projectId, update.data.stage_name, 'completed', 
                        `Confidence: ${update.data.confidence}%`);
                    break;
                
                case 'task_failed':
                    updateStage(projectId, update.data.stage_name, 'failed',
                        `Error: ${update.data.error}`);
                    break;
                
                case 'workflow_completed':
                    updateProjectStatus(projectId, 'completed');
                    break;
                
                case 'workflow_failed':
                    updateProjectStatus(projectId, 'failed');
                    break;
            }
        }

        // Add stage to project
        function addStage(projectId, stageName, status) {
            const stagesDiv = document.getElementById(`stages-${projectId}`);
            const stageDiv = document.createElement('div');
            stageDiv.className = `stage stage-${status}`;
            stageDiv.id = `stage-${projectId}-${stageName}`;
            stageDiv.innerHTML = `
                <div class="stage-name">${getStageIcon(status)} ${formatStageName(stageName)}</div>
                <div class="stage-details" id="details-${projectId}-${stageName}">Processing...</div>
            `;
            stagesDiv.appendChild(stageDiv);
        }

        // Update stage
        function updateStage(projectId, stageName, status, details) {
            const stageDiv = document.getElementById(`stage-${projectId}-${stageName}`);
            if (stageDiv) {
                stageDiv.className = `stage stage-${status}`;
                stageDiv.querySelector('.stage-name').innerHTML = 
                    `${getStageIcon(status)} ${formatStageName(stageName)}`;
                document.getElementById(`details-${projectId}-${stageName}`).textContent = details;
            }
        }

        // Update project status
        function updateProjectStatus(projectId, status) {
            const badge = document.querySelector(`#project-${projectId} .status-badge`);
            if (badge) {
                badge.className = `status-badge status-${status}`;
                badge.textContent = status.charAt(0).toUpperCase() + status.slice(1);
            }
        }

        // Get stage icon
        function getStageIcon(status) {
            const icons = {
                'pending': '⏳',
                'running': '🔄',
                'completed': '✅',
                'failed': '❌'
            };
            return icons[status] || '•';
        }

        // Format stage name
        function formatStageName(stageName) {
            return stageName
                .split('_')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        // Check connection on load
        checkConnection();
        setInterval(checkConnection, 5000);
    </script>
</body>
</html>
